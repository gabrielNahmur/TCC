[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tcc-fuel-guard-backend"
version = "0.1.0"
description = "Backend do protótipo acadêmico de prevenção de abastecimento incompatível"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "paho-mqtt>=2.1,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
